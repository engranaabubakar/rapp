networks:
  oran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
    driver_opts:
      com.docker.network.driver.mtu: 1500
  dataplane:
    driver: macvlan
    driver_opts:
      parent: enp1s0f0np0
    ipam:
      config:
        - subnet: 192.168.200.0/24
  mon_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24

services:
  oai-gnb:
    image: oaisoftwarealliance/oai-gnb:2026.w18
    container_name: oai-gnb
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    networks:
      oran_net:
        ipv4_address: 192.168.100.10
      dataplane:
        ipv4_address: 192.168.200.10
      mon_net:
        ipv4_address: 192.168.50.10
    environment:
      GNB_ID: "1"
      MCC: "208"
      MNC: "93"
      TAC: "0001"
      NSSAI_SST: "1"
      USE_SA: "yes"
      GNB_N2_SVC_IP_ADDR: "192.168.100.10"
      GNB_N3_SVC_IP_ADDR: "192.168.200.10"
      AMF_IP_ADDRESS: "192.168.150.10"
    ports:
      - "8081:8080"
    volumes:
      - ./configs/gnb.conf:/opt/oai-gnb/etc/gnb.conf:ro
    restart: unless-stopped

  oai-nr-ue:
    image: oaisoftwarealliance/oai-nr-ue:2026.w18
    container_name: oai-nr-ue
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    networks:
      oran_net:
        ipv4_address: 192.168.100.20
      dataplane:
        ipv4_address: 192.168.200.20
      mon_net:
        ipv4_address: 192.168.50.20
    environment:
      UE_MCC: "208"
      UE_MNC: "93"
      USE_SA: "yes"
      GNB_IP_ADDRESS: "192.168.100.10"
    depends_on:
      - oai-gnb
    volumes:
      - ./configs/nr-ue.conf:/opt/oai-nr-ue/etc/nr-ue.conf:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-ue
    platform: linux/arm64
    networks:
      mon_net:
        ipv4_address: 192.168.50.30
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor-ue
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      mon_net:
        ipv4_address: 192.168.50.60
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-ue
    platform: linux/arm64
    networks:
      mon_net:
        ipv4_address: 192.168.50.40
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  rapp-controller:
    image: python:3.9-slim
    container_name: rapp-controller
    platform: linux/arm64
    networks:
      oran_net:
        ipv4_address: 192.168.100.50
      mon_net:
        ipv4_address: 192.168.50.50
    volumes:
      - ./scripts/rapp-controller.py:/app/main.py:ro
      - ./configs/requirements.txt:/app/requirements.txt:ro
    working_dir: /app
    command: bash -c "pip install -q -r requirements.txt && python main.py"
    ports:
      - "5000:5000"
    restart: unless-stopped

  qos-enforcer:
    image: ubuntu-qos:22.04
    container_name: qos-enforcer
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    networks:
      oran_net:
        ipv4_address: 192.168.100.60
      dataplane:
        ipv4_address: 192.168.200.60
    volumes:
      - ./scripts/qos-setup.sh:/root/qos-setup.sh:ro
    command: bash -c "/root/qos-setup.sh && sleep infinity"
    restart: unless-stopped
